name: Research integrity checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Python regression suite
        run: python -m pytest -q tests/
      - name: Manuscript numerical provenance
        run: python -m paper.check_reported_results
      - name: Frozen P3 data verification
        run: |
          python data/scripts/freeze_manifest.py --verify
          python data/validate_tasks.py
          python data/scripts/data_checks.py
